{% extends "base.html" %}

{% block title %}知识库 - 密码学评测系统{% endblock %}

{% block content %}
<div class="row">
    <div class="col-12">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2><i class="fas fa-book"></i> 知识库查询</h2>
        </div>
    </div>
</div>

<div class="row">
    <!-- 查询区域 -->
    <div class="col-lg-8">
        <div class="card">
            <div class="card-header">
                <h5 class="mb-0">
                    <i class="fas fa-search"></i> 智能问答
                </h5>
            </div>
            <div class="card-body">
                <form id="queryForm">
                    <div class="mb-3">
                        <label for="question" class="form-label">请输入您的问题</label>
                        <textarea class="form-control" id="question" rows="3" 
                                placeholder="例如：GMT 0010-2012标准中对密钥长度有什么要求？"></textarea>
                    </div>
                    <button type="submit" class="btn btn-primary" id="submitBtn">
                        <i class="fas fa-search"></i> 查询
                    </button>
                    <button type="button" class="btn btn-secondary" onclick="clearResults()">
                        <i class="fas fa-refresh"></i> 清除
                    </button>
                </form>

                <!-- 查询结果 -->
                <div id="queryResult" class="mt-4" style="display: none;">
                    <hr>
                    <h6><i class="fas fa-comment-dots"></i> 查询结果</h6>
                    <div id="answerContent" class="bg-light p-3 rounded">
                        <!-- 答案内容 -->
                    </div>
                    
                    <!-- 相关文档 -->
                    <div id="sourcesContent" class="mt-3">
                        <h6><i class="fas fa-book-open"></i> 相关文档</h6>
                        <div id="sourcesList">
                            <!-- 来源列表 -->
                        </div>
                    </div>

                    <!-- 反馈 -->
                    <div class="mt-3">
                        <small class="text-muted">这个回答对您有帮助吗？</small>
                        <div class="btn-group ms-2" role="group">
                            <button type="button" class="btn btn-sm btn-outline-success" onclick="submitFeedback('good')">
                                <i class="fas fa-thumbs-up"></i> 有用
                            </button>
                            <button type="button" class="btn btn-sm btn-outline-danger" onclick="submitFeedback('bad')">
                                <i class="fas fa-thumbs-down"></i> 无用
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 题目生成 -->
        <div class="card mt-4">
            <div class="card-header">
                <h5 class="mb-0">
                    <i class="fas fa-question-circle"></i> 题目生成
                </h5>
            </div>
            <div class="card-body">
                <form id="questionForm">
                    <div class="row">
                        <div class="col-md-6">
                            <label for="topic" class="form-label">题目主题</label>
                            <input type="text" class="form-control" id="topic" 
                                   placeholder="例如：对称密码算法">
                        </div>
                        <div class="col-md-3">
                            <label for="difficulty" class="form-label">难度级别</label>
                            <select class="form-select" id="difficulty">
                                <option value="easy">简单</option>
                                <option value="medium" selected>中等</option>
                                <option value="hard">困难</option>
                            </select>
                        </div>
                        <div class="col-md-3">
                            <label for="count" class="form-label">题目数量</label>
                            <select class="form-select" id="count">
                                <option value="3">3题</option>
                                <option value="5" selected>5题</option>
                                <option value="10">10题</option>
                            </select>
                        </div>
                    </div>
                    <button type="submit" class="btn btn-success mt-3" id="generateBtn">
                        <i class="fas fa-magic"></i> 生成题目
                    </button>
                </form>

                <!-- 生成的题目 -->
                <div id="questionsResult" class="mt-4" style="display: none;">
                    <hr>
                    <h6><i class="fas fa-list-ol"></i> 生成的题目</h6>
                    <div id="questionsList">
                        <!-- 题目列表 -->
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 侧边栏 -->
    <div class="col-lg-4">
        <!-- 快速查询 -->
        <div class="card">
            <div class="card-header">
                <h6 class="mb-0">
                    <i class="fas fa-bolt"></i> 快速查询
                </h6>
            </div>
            <div class="card-body">
                <div class="d-grid gap-2">
                    <button class="btn btn-outline-primary btn-sm" onclick="quickQuery('GMT标准有哪些？')">
                        GMT标准有哪些？
                    </button>
                    <button class="btn btn-outline-primary btn-sm" onclick="quickQuery('对称密码算法的特点')">
                        对称密码算法的特点
                    </button>
                    <button class="btn btn-outline-primary btn-sm" onclick="quickQuery('数字签名算法原理')">
                        数字签名算法原理
                    </button>
                    <button class="btn btn-outline-primary btn-sm" onclick="quickQuery('密钥管理的安全要求')">
                        密钥管理的安全要求
                    </button>
                </div>
            </div>
        </div>

        <!-- 知识分类 -->
        <div class="card mt-4">
            <div class="card-header">
                <h6 class="mb-0">
                    <i class="fas fa-tags"></i> 知识分类
                </h6>
            </div>
            <div class="card-body">
                <div class="list-group list-group-flush">
                    <a href="#" class="list-group-item list-group-item-action" onclick="searchByCategory('标准规范')">
                        <i class="fas fa-file-text"></i> 标准规范
                    </a>
                    <a href="#" class="list-group-item list-group-item-action" onclick="searchByCategory('对称密码')">
                        <i class="fas fa-key"></i> 对称密码
                    </a>
                    <a href="#" class="list-group-item list-group-item-action" onclick="searchByCategory('非对称密码')">
                        <i class="fas fa-lock"></i> 非对称密码
                    </a>
                    <a href="#" class="list-group-item list-group-item-action" onclick="searchByCategory('数字签名')">
                        <i class="fas fa-signature"></i> 数字签名
                    </a>
                    <a href="#" class="list-group-item list-group-item-action" onclick="searchByCategory('密钥管理')">
                        <i class="fas fa-cogs"></i> 密钥管理
                    </a>
                </div>
            </div>
        </div>

        <!-- 查询历史 -->
        <div class="card mt-4">
            <div class="card-header">
                <h6 class="mb-0">
                    <i class="fas fa-history"></i> 查询历史
                </h6>
            </div>
            <div class="card-body">
                <div id="queryHistory">
                    <p class="text-muted small">暂无查询历史</p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
let currentQueryId = null;
let queryHistory = JSON.parse(localStorage.getItem('queryHistory') || '[]');

// 页面加载时显示历史记录
document.addEventListener('DOMContentLoaded', function() {
    displayQueryHistory();
});

// 查询表单提交
document.getElementById('queryForm').addEventListener('submit', function(e) {
    e.preventDefault();
    const question = document.getElementById('question').value.trim();
    if (question) {
        submitQuery(question);
    }
});

// 题目生成表单提交
document.getElementById('questionForm').addEventListener('submit', function(e) {
    e.preventDefault();
    generateQuestions();
});

function submitQuery(question) {
    const submitBtn = document.getElementById('submitBtn');
    const originalText = submitBtn.innerHTML;
    
    submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> 查询中...';
    submitBtn.disabled = true;

    fetch('/api/knowledge/query', {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json',
        },
        body: JSON.stringify({ question: question })
    })
    .then(response => response.json())
    .then(data => {
        if (data.success) {
            displayQueryResult(data.data);
            addToHistory(question);
        } else {
            showError('查询失败：' + data.error);
        }
    })
    .catch(error => {
        showError('查询失败：' + error.message);
    })
    .finally(() => {
        submitBtn.innerHTML = originalText;
        submitBtn.disabled = false;
    });
}

function displayQueryResult(result) {
    document.getElementById('answerContent').innerHTML = result.answer;
    
    // 显示相关文档
    const sourcesList = document.getElementById('sourcesList');
    if (result.sources && result.sources.length > 0) {
        sourcesList.innerHTML = result.sources.map(source => `
            <div class="border rounded p-2 mb-2">
                <strong>${source.title}</strong>
                <br><small class="text-muted">来源：${source.source}</small>
            </div>
        `).join('');
    } else {
        sourcesList.innerHTML = '<p class="text-muted small">无相关文档</p>';
    }
    
    document.getElementById('queryResult').style.display = 'block';
}

function generateQuestions() {
    const topic = document.getElementById('topic').value.trim();
    const difficulty = document.getElementById('difficulty').value;
    const count = document.getElementById('count').value;
    
    if (!topic) {
        alert('请输入题目主题');
        return;
    }

    const generateBtn = document.getElementById('generateBtn');
    const originalText = generateBtn.innerHTML;
    
    generateBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> 生成中...';
    generateBtn.disabled = true;

    fetch('/api/knowledge/generate-questions', {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json',
        },
        body: JSON.stringify({ 
            topic: topic,
            difficulty: difficulty,
            count: parseInt(count)
        })
    })
    .then(response => response.json())
    .then(data => {
        if (data.success) {
            displayQuestions(data.data.questions);
        } else {
            showError('生成失败：' + data.error);
        }
    })
    .catch(error => {
        showError('生成失败：' + error.message);
    })
    .finally(() => {
        generateBtn.innerHTML = originalText;
        generateBtn.disabled = false;
    });
}

function displayQuestions(questions) {
    const questionsList = document.getElementById('questionsList');
    
    if (questions && questions.length > 0) {
        questionsList.innerHTML = questions.map((q, index) => `
            <div class="card mb-3">
                <div class="card-body">
                    <h6 class="card-title">题目 ${index + 1}</h6>
                    <p class="card-text">${q.question}</p>
                    
                    <div class="row">
                        ${Object.entries(q.options || {}).map(([key, value]) => `
                            <div class="col-md-6 mb-2">
                                <strong>${key}.</strong> ${value}
                            </div>
                        `).join('')}
                    </div>
                    
                    <div class="mt-3">
                        <strong class="text-success">正确答案：${q.correct_answer}</strong>
                        <p class="text-muted small mt-1">${q.explanation}</p>
                    </div>
                </div>
            </div>
        `).join('');
    } else {
        questionsList.innerHTML = '<p class="text-muted">未能生成题目</p>';
    }
    
    document.getElementById('questionsResult').style.display = 'block';
}

function quickQuery(question) {
    document.getElementById('question').value = question;
    submitQuery(question);
}

function searchByCategory(category) {
    const query = `${category}相关知识`;
    document.getElementById('question').value = query;
    submitQuery(query);
}

function clearResults() {
    document.getElementById('question').value = '';
    document.getElementById('queryResult').style.display = 'none';
    document.getElementById('questionsResult').style.display = 'none';
}

function submitFeedback(type) {
    // 这里可以实现反馈提交逻辑
    alert(`谢谢您的反馈！我们会继续改进。`);
}

function addToHistory(question) {
    queryHistory.unshift({
        question: question,
        timestamp: new Date().toLocaleString()
    });
    
    // 保持最多10条历史记录
    if (queryHistory.length > 10) {
        queryHistory = queryHistory.slice(0, 10);
    }
    
    localStorage.setItem('queryHistory', JSON.stringify(queryHistory));
    displayQueryHistory();
}

function displayQueryHistory() {
    const historyContainer = document.getElementById('queryHistory');
    
    if (queryHistory.length === 0) {
        historyContainer.innerHTML = '<p class="text-muted small">暂无查询历史</p>';
        return;
    }
    
    historyContainer.innerHTML = queryHistory.map(item => `
        <div class="border-bottom pb-2 mb-2">
            <a href="#" class="text-decoration-none small" onclick="quickQuery('${item.question}')">
                ${item.question}
            </a>
            <br><small class="text-muted">${item.timestamp}</small>
        </div>
    `).join('');
}

function showError(message) {
    // 可以使用Toast或其他方式显示错误
    alert(message);
}
</script>
{% endblock %}
