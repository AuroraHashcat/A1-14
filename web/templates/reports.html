{% extends "base.html" %}

{% block title %}报告列表 - 密码学评测系统{% endblock %}

{% block content %}
<h2>报告列表</h2>
<ul>
    {% for report in reports %}
    <li>
        <a href="{{ url_for('web.report_detail', report_id=report.id) }}">{{ report.title }}</a>
        <span>状态: {{ report.status }}</span>
        <span>创建时间: {{ report.created_at }}</span>
    </li>
    {% else %}
    <li>暂无报告。</li>
    {% endfor %}
</ul>
{% endblock %}
