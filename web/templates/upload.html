{% extends "base.html" %}

{% block title %}文件上传 - 密码学评测系统{% endblock %}

{% block content %}
<h2>文件上传</h2>
<form method="post" enctype="multipart/form-data">
    <label for="files">选择文件（可多选）：</label>
    <input type="file" name="files" id="files" multiple>
    <button type="submit">上传并测评</button>
</form>
{% if result %}<p>{{ result }}</p>{% endif %}
{% endblock %}
